name: Crawl markets
run-name: ${{ inputs.operation == 'clear' && 'Clear data' || 'Crawl' }} ${{ inputs.request_id || 'scheduled' }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        required: false
        type: choice
        options:
          - crawl
          - clear
        default: crawl
      request_id:
        description: Request ID from the web UI
        required: false
        default: manual
      keyword:
        description: Search keyword
        required: true
        default: realforce
      keywords:
        description: Comma-separated search keywords for Korea and Japan markets
        required: false
        default: realforce
      markets:
        description: Comma-separated markets
        required: true
        default: joongna,bunjang,guheyo,mercari,goofish
      sort:
        description: Sort order
        required: true
        type: choice
        options:
          - price-asc
          - price-desc
          - newest
        default: newest
      limit:
        description: Product limit per market
        required: true
        default: "50"
  schedule:
    - cron: "0 5,12,23 * * *"

permissions:
  contents: write

concurrency:
  group: market-data-writes
  queue: max

jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      KEYWORD: ${{ inputs.keyword || 'realforce' }}
      KEYWORDS: ${{ inputs.keywords || inputs.keyword || 'realforce' }}
      MARKETS: ${{ inputs.markets || 'joongna,bunjang,guheyo,mercari,goofish' }}
      SORT: ${{ inputs.sort || 'newest' }}
      LIMIT: ${{ inputs.limit || '50' }}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      APIFY_GOOFISH_ACTOR: zen-studio/goofish-xianyu-search-scraper
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify runner Chrome
        run: google-chrome --version
      - name: Crawl products
        if: ${{ inputs.operation != 'clear' }}
        shell: bash
        run: |
          IFS=',' read -r -a selected_markets <<< "$MARKETS"
          non_china_markets=""
          run_goofish=false

          for market in "${selected_markets[@]}"; do
            if [[ "$market" == "goofish" ]]; then
              run_goofish=true
            elif [[ -n "$market" ]]; then
              non_china_markets+="${non_china_markets:+,}${market}"
            fi
          done

          if [[ -n "$non_china_markets" ]]; then
            node crawl.js --keywords="$KEYWORDS" --markets="$non_china_markets" --sort="$SORT" --limit="$LIMIT"
          fi

          if [[ "$run_goofish" == true ]]; then
            if ! node crawl.js --keywords="$KEYWORDS" --markets="goofish" --sort="$SORT" --limit="$LIMIT"; then
              echo "::warning::Goofish crawl failed; keeping the previous data and manifest error."
            fi
          fi
      - name: Clear product data
        if: ${{ inputs.operation == 'clear' }}
        run: node scripts/clear-data.js
      - name: Commit market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet && exit 0
          CRAWLED_AT="$(TZ=Asia/Ho_Chi_Minh date '+%Y-%m-%d %H:%M:%S %Z')"
          git commit -m "chore: update market data - ${CRAWLED_AT}"
          git push
